<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Вход</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap">
<link rel="stylesheet" href="/assets/base.css">
<link rel="stylesheet" href="/assets/login.css">
</head>
<body>
<div class="bg" aria-hidden="true">
  <div class="sheen"></div>
  <span class="spark" style="top:8%;left:12%;animation-delay:0s"></span>
  <span class="spark" style="top:18%;left:78%;animation-delay:1.3s"></span>
  <span class="spark" style="top:42%;left:6%;animation-delay:2.6s"></span>
  <span class="spark" style="top:60%;left:90%;animation-delay:.7s"></span>
  <span class="spark" style="top:78%;left:30%;animation-delay:3.4s"></span>
  <span class="spark" style="top:90%;left:66%;animation-delay:2s"></span>
</div>

<main class="login">
  <div class="logo" aria-hidden="true">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="14" rx="3"/><path d="M8 21h8"/><path d="M12 14.5s-3-1.9-3-3.9A1.6 1.6 0 0 1 12 9.7a1.6 1.6 0 0 1 3 .9c0 2-3 3.9-3 3.9z"/></svg>
  </div>
  <h1>Наш кинозал</h1>
  <p class="sub">Вход только для своих</p>

  <form method="post" action="/login" class="card">
    <p id="error" class="error" role="alert" hidden></p>
    <label for="login">Логин</label>
    <input id="login" name="login" class="input" autocomplete="username" autocapitalize="none" spellcheck="false" required>
    <label for="password">Пароль</label>
    <input id="password" name="password" type="password" class="input" autocomplete="current-password" required>
    <button type="submit" class="btn">Войти</button>
  </form>
</main>
<script src="/assets/login.js"></script>
</body>
</html>
