<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Наш кинозал</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/assets/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<meta name="theme-color" content="#1A100A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap">
<link rel="stylesheet" href="/assets/base.css">
<link rel="stylesheet" href="/app/app.css">
</head>
<body>
<div class="bg" aria-hidden="true">
  <div class="sheen"></div>
  <span class="spark" style="top:6%;left:9%;animation-delay:0s"></span>
  <span class="spark" style="top:14%;left:38%;animation-delay:1.2s"></span>
  <span class="spark" style="top:9%;left:71%;animation-delay:2.6s"></span>
  <span class="spark" style="top:22%;left:92%;animation-delay:.7s"></span>
  <span class="spark" style="top:31%;left:3%;animation-delay:3.3s"></span>
  <span class="spark" style="top:44%;left:58%;animation-delay:1.9s"></span>
  <span class="spark" style="top:52%;left:97%;animation-delay:4s"></span>
  <span class="spark" style="top:63%;left:21%;animation-delay:2.2s"></span>
  <span class="spark" style="top:71%;left:76%;animation-delay:.4s"></span>
  <span class="spark" style="top:82%;left:6%;animation-delay:3.7s"></span>
  <span class="spark" style="top:89%;left:47%;animation-delay:1.5s"></span>
  <span class="spark" style="top:95%;left:88%;animation-delay:2.9s"></span>
</div>

<header class="top">
  <div class="brand">
    <div class="brand-mark" aria-hidden="true">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="14" rx="3"/><path d="M8 21h8"/><path d="M12 14.5s-3-1.9-3-3.9A1.6 1.6 0 0 1 12 9.7a1.6 1.6 0 0 1 3 .9c0 2-3 3.9-3 3.9z"/></svg>
    </div>
    <div>
      <div class="brand-name">Наш кинозал</div>
      <div class="brand-sub">Комната для двоих</div>
    </div>
  </div>
  <div class="top-right">
    <div class="presence" id="presence" aria-live="polite">
      <div class="avatars" id="avatars"></div>
      <div>
        <div class="presence-title" id="presenceTitle">Подключаемся…</div>
        <div class="presence-sub" id="presenceSub"></div>
      </div>
    </div>
    <form method="post" action="/logout">
      <button type="submit" class="btn btn-ghost">Выйти</button>
    </form>
  </div>
</header>

<main class="layout">
  <section class="stage">

    <div class="source-bar">
      <div class="tabs" role="tablist" aria-label="Источник видео">
        <button type="button" role="tab" class="tab" id="tabYt" aria-selected="true">YouTube</button>
        <button type="button" role="tab" class="tab" id="tabUrl" aria-selected="false">Ссылка</button>
        <button type="button" role="tab" class="tab" id="tabFile" aria-selected="false">Свой файл</button>
      </div>

      <div class="panel" id="panelUrl" hidden>
        <div class="seg" role="group" aria-label="Как открыть ссылку">
          <button type="button" class="seg-btn" data-urlmode="direct" aria-pressed="true">Прямо в браузере</button>
          <button type="button" class="seg-btn" data-urlmode="server" aria-pressed="false">Через сервер</button>
        </div>
        <form class="row" id="urlForm">
          <label for="urlInput" class="sr-only">Ссылка на видео</label>
          <input id="urlInput" class="input grow" type="text" inputmode="url" placeholder="Вставь ссылку на видео" autocomplete="off">
          <button type="submit" class="btn">Смотреть</button>
          <button type="button" class="btn btn-ghost" id="urlQueue">В очередь</button>
        </form>
        <p class="hint" id="urlHint"></p>
        <p class="hint warn" id="urlWarn" hidden></p>
      </div>

      <div class="panel" id="panelYt">
        <div class="seg" role="group" aria-label="Каким плеером смотреть YouTube">
          <button type="button" class="seg-btn" data-ytmode="youtube" aria-pressed="true">Обычный плеер · нужен VPN</button>
          <button type="button" class="seg-btn" data-ytmode="proxy" aria-pressed="false">Через сервер</button>
        </div>
        <form class="row" id="ytForm">
          <label for="ytUrl" class="sr-only">Ссылка на YouTube</label>
          <input id="ytUrl" class="input grow" type="text" inputmode="url" placeholder="Вставь ссылку на ролик" autocomplete="off">
          <button type="submit" class="btn">Смотреть</button>
          <button type="button" class="btn btn-ghost" id="ytQueue">В очередь</button>
        </form>
        <p class="hint" id="ytHint"></p>
      </div>

      <div class="panel" id="panelFile" hidden>
        <div class="seg" role="group" aria-label="Как смотреть файл">
          <button type="button" class="seg-btn" data-filemode="upload" aria-pressed="true">Загрузить на сервер</button>
          <button type="button" class="seg-btn" data-filemode="local" aria-pressed="false">У каждого свой файл</button>
        </div>
        <div class="row">
          <input type="file" id="fileInput" accept="video/*,.mkv" class="sr-only" tabindex="-1">
          <button type="button" class="btn" id="pickFile">Выбрать файл</button>
          <div class="upload" id="uploadBox" hidden>
            <div class="upload-name" id="uploadName"></div>
            <div class="bar"><div class="bar-fill" id="uploadBar"></div></div>
            <div class="upload-actions" id="uploadActions" hidden>
              <button type="button" class="btn" id="uploadPlay">Смотреть</button>
              <button type="button" class="btn btn-ghost" id="uploadQueue">В очередь</button>
            </div>
          </div>
        </div>
        <p class="hint" id="fileHint"></p>
      </div>
    </div>

    <div class="player" id="playerWrap">
      <div class="yt-box" id="ytBox" hidden><div id="ytHost"></div></div>
      <video id="video" playsinline preload="auto" hidden></video>
      <div class="click-catch" id="clickCatch"></div>

      <div class="chip chip-tl" id="syncChip"><span class="dot" id="syncDot"></span><span id="syncText">Подключаемся…</span></div>
      <div class="chip chip-tr" id="fileChip" hidden></div>
      <div class="floats" id="floats" aria-hidden="true"></div>

      <div class="overlay" id="overlay" hidden>
        <div class="overlay-inner" id="overlayInner"></div>
      </div>
    </div>

    <div class="controls">
      <div class="now" id="nowTitle">Ничего не включено</div>
      <label for="seek" class="sr-only">Перемотка</label>
      <input type="range" id="seek" class="seek" min="0" max="0" step="0.1" value="0">
      <div class="controls-row">
        <button type="button" class="icon-btn" id="playBtn" aria-label="Воспроизвести">
          <svg id="icPlay" width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z"/></svg>
          <svg id="icPause" width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" hidden><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
        </button>
        <span class="time" id="time">0:00 <span class="muted">/ 0:00</span></span>
        <span class="last-action" id="lastAction" aria-live="polite"></span>
        <label for="volume" class="sr-only">Громкость</label>
        <svg class="vol-ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
        <input type="range" id="volume" class="volume" min="0" max="1" step="0.01" value="0.9">
        <div class="cc-wrap" id="setWrap" hidden>
          <button type="button" class="icon-btn" id="setBtn" aria-label="Настройки видео" aria-haspopup="menu" aria-expanded="false">
            <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
          <div class="cc-menu" id="setMenu" role="menu" aria-label="Настройки видео" hidden></div>
        </div>
        <button type="button" class="icon-btn" id="fsBtn" aria-label="На весь экран">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
        </button>
      </div>
    </div>

    <div class="reactions" id="reactions">
      <span class="reactions-label">Реакции</span>
      <button type="button" class="react" data-react="heart" aria-label="Сердечко" style="--c:#FF7AA8"></button>
      <button type="button" class="react" data-react="fire" aria-label="Огонь" style="--c:#FF9F5A"></button>
      <button type="button" class="react" data-react="laugh" aria-label="Смешно" style="--c:#FFD25A"></button>
      <button type="button" class="react" data-react="star" aria-label="Звезда" style="--c:#8FB8FF"></button>
      <button type="button" class="react" data-react="cry" aria-label="Грустно" style="--c:#7FD6E0"></button>
    </div>

    <div class="card queue">
      <div class="card-head">
        <h2>Очередь <span class="muted" id="queueCount">· 0</span></h2>
      </div>
      <ol class="queue-list" id="queueList"></ol>
      <p class="empty" id="queueEmpty">Пока пусто. Добавляй ролики кнопкой «В очередь».</p>
    </div>
  </section>

  <aside class="card chat">
    <div class="card-head">
      <h2>Чатик</h2>
      <span class="typing" id="typing" aria-live="polite"></span>
    </div>
    <div class="messages" id="messages"></div>
    <form class="chat-form" id="chatForm">
      <label for="chatInput" class="sr-only">Сообщение</label>
      <input id="chatInput" class="input grow" type="text" maxlength="1000" autocomplete="off" placeholder="Написать…">
      <button type="submit" class="icon-btn send" aria-label="Отправить">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
      </button>
    </form>
  </aside>
</main>

<script src="/app/app.js"></script>
</body>
</html>
